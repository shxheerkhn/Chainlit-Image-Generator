services:
  - type: web
    name: chainlit-pollinations-image-gen
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: chainlit run app.py --host 0.0.0.0 --port $PORT --headless
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: POLLINATIONS_MODEL
        value: flux
      - key: POLLINATIONS_WIDTH
        value: "1024"
      - key: POLLINATIONS_HEIGHT
        value: "1024"
      
